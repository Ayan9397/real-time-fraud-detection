name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fraud_detection
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d fraud_detection"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: fraud_detection

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff
        run: |
          files=$(git diff --name-only HEAD^ HEAD -- '*.py')
          if [ -n "$files" ]; then
            ruff check $files
          else
            echo "No Python files changed; skipping Ruff check."
          fi

      - name: Run Black check
        run: |
          files=$(git diff --name-only HEAD^ HEAD -- '*.py')
          if [ -n "$files" ]; then
            black --check $files
          else
            echo "No Python files changed; skipping Black check."
          fi

      - name: Run tests
        run: pytest -q

      - name: Build Docker image
        run: docker build -f docker/api.Dockerfile -t fraud-detection-api:ci .
